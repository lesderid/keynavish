name: CI

on: [push, pull_request]

jobs:
  windows:
    runs-on: windows-latest

    steps:
        - name: Checkout keynavish
          uses: actions/checkout@v4
          with:
            fetch-depth: 0
        - name: Install dmd and dub
          uses: dlang-community/setup-dlang@v1
          with:
            compiler: dmd-latest
        - name: Build keynavish (x86_64)
          run: dub build -a=x86_64
        - name: Rename artifact
          run: Rename-Item -Path out/keynavish.exe -NewName "keynavish-${{ github.sha }}-x86_64.exe"
        - name: Upload keynavish (x86_64)
          uses: actions/upload-artifact@v4
          with:
            name: keynavish-${{ github.sha }}-x86_64
            path: out/keynavish-${{ github.sha }}-x86_64.exe

  macos:
    runs-on: macos-latest

    steps:
        - name: Checkout keynavish
          uses: actions/checkout@v4
          with:
            fetch-depth: 0
        - name: Install ldc and dub
          uses: dlang-community/setup-dlang@v1
          with:
            compiler: ldc-latest
        - name: Run tests
          run: ./tools/run-tests.sh
        - name: Build keynavish.app
          run: ./tools/build-macos.sh release
        - name: Verify the bundle is universal
          run: |
            archs=$(lipo -archs out/keynavish.app/Contents/MacOS/keynavish)
            echo "architectures: $archs"
            for want in arm64 x86_64; do
              case " $archs " in
                *" $want "*) ;;
                *) echo "::error::bundle is missing the $want slice"; exit 1 ;;
              esac
            done
        - name: Package bundle
          run: ditto -c -k --keepParent out/keynavish.app "keynavish-${{ github.sha }}-macos.zip"
        - name: Upload keynavish.app
          uses: actions/upload-artifact@v4
          with:
            name: keynavish-${{ github.sha }}-macos
            path: keynavish-${{ github.sha }}-macos.zip
